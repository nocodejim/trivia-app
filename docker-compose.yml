# Note: The 'version' attribute has been removed.
services:
  # Our PHP/Apache Web Server
  app:
    build:
      context: . # Use the Dockerfile in the current directory
      dockerfile: Dockerfile
    container_name: trivia_app_php
    depends_on:
      - db
    volumes:
      - ./:/var/www/html/ # Map current project files into the container
    ports:
      - "8080:80" # Map localhost port 8080 to the container's port 80
    restart: unless-stopped

  # Our MySQL Database Server
  db:
    image: mysql:8.0
    container_name: trivia_app_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trivia_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      # This saves your database data even if you stop the container
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data: # Defines the persistent data volume
